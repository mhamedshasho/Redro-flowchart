name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install packaging tools
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets sharp
      - name: Prepare app web files
        run: |
          mkdir -p www resources
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='android' --exclude='www' --exclude='resources' ./ www/
          node --input-type=module -e '
            import sharp from "sharp";
            import { existsSync } from "node:fs";
            const source = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#111318"/><g fill="none" stroke="#ef303b" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"><rect x="76" y="82" width="128" height="88" rx="18"/><rect x="308" y="82" width="128" height="88" rx="18"/><rect x="192" y="342" width="128" height="88" rx="18"/><path d="M204 126h104M256 170v86m0 0-80 0v86m80-86h80v86"/></g><g fill="#f5f6fa"><circle cx="140" cy="126" r="13"/><circle cx="372" cy="126" r="13"/><circle cx="256" cy="386" r="13"/></g></svg>`;
            await sharp(Buffer.from(source)).resize(1024,1024).png().toFile("resources/icon.png");
          '
      - name: Initialize Capacitor Android
        run: |
          npx cap init "Redro Flowchart" "com.redro.flowchart" --web-dir=www
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redro-flowchart-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
