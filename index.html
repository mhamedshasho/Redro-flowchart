<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Redro Flowchart</title>
<style>html,body{margin:0;min-height:100%;background:#101216;color:#f4f6fa;font-family:system-ui, sans-serif}body{display:grid;place-items:center;min-height:100dvh}.loader{text-align:center;padding:24px}.loader strong{color:#ef303b;font-size:30px}.loader p{color:#aab2c0}</style>
<script>
(()=>{const go=()=>{const mobile=matchMedia('(max-width: 760px), (pointer: coarse) and (max-width: 1024px)').matches;location.replace(mobile?'mobile.html':'desktop.html')};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go,{once:true});else go()})();
</script>
</head>
<body><main class="loader"><strong>Redro Flowchart</strong><p>Preparing your workspace…</p><noscript>Enable JavaScript to select the correct edition.</noscript></main></body>
</html>
